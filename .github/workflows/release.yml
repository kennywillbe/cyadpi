name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# This workflow publishes: every third-party action here is pinned by commit, so
# a moved tag cannot change what runs with a write token.
env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # No version in the file name, so the README can link to
      # releases/latest/download/... and never go stale.
      - name: Package
        run: |
          tar -czf cyadpi-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release cyadpi
          shasum -a 256 cyadpi-${{ matrix.target }}.tar.gz > cyadpi-${{ matrix.target }}.tar.gz.sha256
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            cyadpi-${{ matrix.target }}.tar.gz
            cyadpi-${{ matrix.target }}.tar.gz.sha256
          # Notes are added once by the job below, not once per target.
          generate_release_notes: false

  notes:
    name: release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: binaries
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
